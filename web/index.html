<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Read and program iButton serial numbers directly from your browser using a USB programmer and Web Serial.">
  <meta name="theme-color" content="#009ac7">
  <meta name="color-scheme" content="light">
  <title>iButton Programmer</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <main class="card">
    <header>
      <div>
        <p class="eyebrow">iButton Programmer</p>
        <h1>iButton Programmer</h1>
      </div>
      <span id="status" class="status disconnected">Disconnected</span>
    </header>

    <button id="connect" type="button" class="primary wide">Connect device</button>
    <p id="message" class="message" aria-live="polite"></p>

    <section id="programmer" hidden>
      <label id="serial-label">Serial number</label>
      <div id="serial-fields" class="serial-fields" role="group" aria-labelledby="serial-label">
        <input class="serial-byte" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="2" aria-label="Byte 1" disabled>
        <input class="serial-byte" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="2" aria-label="Byte 2" disabled>
        <input class="serial-byte" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="2" aria-label="Byte 3" disabled>
        <input class="serial-byte" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="2" aria-label="Byte 4" disabled>
        <input class="serial-byte" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="2" aria-label="Byte 5" disabled>
        <input class="serial-byte" type="text" inputmode="text" autocomplete="off" spellcheck="false" maxlength="2" aria-label="Byte 6" disabled>
      </div>
      <p class="hint">6-byte serial number, e.g. 12 34 56 78 9A BC</p>

      <div class="actions">
        <button id="read" type="button" class="primary" disabled>Read</button>
        <button id="write" type="button" class="write-primary" disabled>Write</button>
      </div>
      <p class="write-note">Write changes the serial number. Keep the iButton in place until verification finishes.</p>

      <details class="protocol-details">
        <summary>Debug</summary>
        <div class="protocol-toolbar">
          <span>Protocol diagnostics</span>
          <div class="debug-actions">
            <button id="detect" type="button" class="debug-detect-button" disabled>Detect button type</button>
            <div class="debug-log-actions">
              <button id="copy-log" type="button" class="log-button">Copy</button>
              <button id="clear-log" type="button" class="log-button">Clear</button>
            </div>
          </div>
        </div>
        <pre id="protocol-log" class="protocol-log" aria-label="Debug log"></pre>
      </details>
    </section>
  </main>

  <script src="particles.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
