name: Deploy programmer web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'firmware/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build Arduino Nano firmware
        working-directory: firmware
        run: pio run
      - name: Prepare Nano firmware
        run: |
          mkdir -p web/firmware
          cp firmware/.pio/build/nanoatmega328/firmware.hex web/firmware/firmware.hex
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@98ef48e41587a300b82de4cf298aa98b57b2faae
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
