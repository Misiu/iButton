name: Build firmware

on:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.19

      - name: Build Arduino Nano firmware
        working-directory: firmware
        run: pio run --environment nanoatmega328

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ibutton-programmer-firmware-0.4.0
          path: firmware/.pio/build/nanoatmega328/firmware.hex
          if-no-files-found: error
